      <stop offset="0" stop-color="#144841"/>
      <stop offset="1" stop-color="#2d8c7c"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <g stroke="#7cc8b6" stroke-opacity="0.28" stroke-width="2.5" fill="none">
