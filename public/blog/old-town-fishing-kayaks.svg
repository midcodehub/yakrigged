  <text x="78" y="394" font-family="Arial, Helvetica, sans-serif" font-size="88" font-weight="800" fill="#ffffff">Fishing <tspan fill="#f08a3e">Kayaks</tspan></text>
  <text x="80" y="464" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="500" fill="#d6efe9">The Sportsman lineup — paddle, pedal &amp; motor</text>
